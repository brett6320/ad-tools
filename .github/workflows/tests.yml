name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q --junitxml=junit.xml --cov --cov-report=term-missing --cov-report=json:coverage.json
      - name: Test without truststore (stdlib only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip uninstall -y truststore
          python -m pytest -q -p no:cacheprovider
      - name: Summary
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        shell: bash
        run: >
          python .github/scripts/test_report.py summary
          --name "ad-tools (${{ matrix.os }})" --python "${{ matrix.python }}"
          --junit junit.xml --coverage coverage.json --stats-out stats.json
      - name: Keep stats for the badges
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.13' && !cancelled() && hashFiles('stats.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: stats
          path: stats.json
          retention-days: 7

  badges:
    name: Publish badges
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: badges
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: stats
          path: stats
      - name: Update the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --depth=1 origin badges
            git worktree add badges FETCH_HEAD
            git -C badges checkout -B badges
          else
            git worktree add --orphan -b badges badges
          fi
          python .github/scripts/test_report.py badges --stats stats/stats.json --slug adtools --out badges
          git -C badges add -A
          if git -C badges diff --cached --quiet; then echo "No badge changes"; exit 0; fi
          git -C badges commit -q -m "Badges (${GITHUB_SHA::7})"
          git -C badges push origin badges

  smoke:
    name: Install and run CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: ad-query --version && ad-query groups --help
