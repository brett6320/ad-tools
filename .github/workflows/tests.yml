name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q --junitxml=junit.xml --cov --cov-report=term-missing --cov-report=xml
      - name: Test without truststore (stdlib only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip uninstall -y truststore
          python -m pytest -q
      - name: Summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("junit.xml").getroot()
          s = s if s.tag == "testsuite" else s[0]
          c = ET.parse("coverage.xml").getroot()
          print(f"### ${{ matrix.os }} / Python ${{ matrix.python }}")
          print(f"tests: {s.get('tests')}, failures: {s.get('failures')}, errors: {s.get('errors')}, "
                f"skipped: {s.get('skipped')}, line coverage: {float(c.get('line-rate')) * 100:.1f}%")
          PY

  smoke:
    name: Install and run CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: ad-query --version && ad-query groups --help
